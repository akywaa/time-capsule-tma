<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Time Capsule</title>
    <!-- Подключаем Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем 3D-движок для моделей -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <!-- Красивый шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #09090b; 
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff; 
            --accent: #007aff; 
            --accent-glow: rgba(0, 122, 255, 0.5);
            --star: #f5a623; 
            --star-glow: rgba(245, 166, 35, 0.5);
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            background-image: radial-gradient(circle at 50% -20%, #1a1a24 0%, var(--bg) 80%);
            color: var(--text); 
            padding: 24px 16px; 
            text-align: center; 
            margin: 0; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .hidden { display: none !important; }
        
        h2 { font-weight: 800; font-size: 28px; margin-bottom: 8px; letter-spacing: -0.5px; }
        p { color: #a1a1aa; font-size: 15px; margin-top: 0; line-height: 1.4; }

        /* Элементы форм (Glassmorphism) */
        textarea, select { 
            width: 100%; 
            box-sizing: border-box; 
            padding: 16px; 
            margin: 12px 0; 
            border-radius: 16px; 
            border: 1px solid var(--glass-border); 
            background: var(--glass-bg); 
            backdrop-filter: blur(10px);
            color: white; 
            font-size: 16px; 
            font-family: inherit;
            resize: none; 
            transition: all 0.3s ease;
        }
        textarea:focus, select:focus { 
            outline: none; 
            border-color: var(--accent); 
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        button { 
            width: 100%; 
            padding: 16px; 
            border-radius: 16px; 
            background: var(--accent); 
            color: white; 
            border: none; 
            font-weight: 600; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 16px; 
            transition: transform 0.1s, box-shadow 0.3s; 
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.6; pointer-events: none; }
        
        /* Кнопка взлома */
        .btn-stars { 
            background: linear-gradient(135deg, #f0a010, #d98010); 
            color: #1a0a00; 
            box-shadow: 0 4px 20px var(--star-glow); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
        }
        
        /* 3D Сейф */
        .model-container {
            width: 100%;
            height: 280px;
            margin: 20px 0;
            position: relative;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
            outline: none;
        }

        /* Таймер */
        .timer-wrapper {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }
        
        .timer { 
            font-size: 42px; 
            font-weight: 800; 
            font-variant-numeric: tabular-nums; 
            color: var(--text);
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
            margin-top: 8px;
        }
        
        .content-box { 
            background: var(--glass-bg); 
            padding: 24px; 
            border-radius: 20px; 
            margin-top: 20px; 
            border: 1px solid var(--glass-border); 
            text-align: left; 
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease;
        }
        .content-box h3 { margin-top: 0; color: var(--accent); font-weight: 800; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН СОЗДАНИЯ -->
    <div id="create-view" class="hidden">
        <h2>Капсула времени ⏳</h2>
        <p>Спрячь секрет или признание от друга на время. Доступ откроется только по таймеру!</p>
        
        <textarea id="text-input" rows="4" placeholder="Напиши свой секрет здесь..."></textarea>
        
        <select id="time-input">
            <option value="1">🔒 Запереть на 1 час</option>
            <option value="24">🔒 Запереть на 24 часа</option>
            <option value="168">🔒 Запереть на 1 неделю</option>
        </select>
        
        <button onclick="createCapsule()" id="create-btn">Спрятать в сейф</button>
    </div>

    <!-- ЭКРАН ПРОСМОТРА / ВЗЛОМА -->
    <div id="view-view" class="hidden">
        
        <!-- 3D МОДЕЛЬ СЕЙФА: src задаётся только после ответа API, poster показывается сразу -->
        <div class="model-container">
            <model-viewer id="safe-model" 
                          poster="/safe-poster.webp"
                          loading="lazy"
                          reveal="interaction"
                          auto-rotate 
                          camera-controls 
                          disable-zoom 
                          shadow-intensity="1" 
                          interaction-prompt="none">
            </model-viewer>
        </div>
        
        <div id="status-container">
            <div class="timer-wrapper">
                <div style="color: #a1a1aa; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Сейф откроется через</div>
                <div class="timer" id="timer">--:--:--</div>
            </div>
            
            <button id="hack-btn" class="btn-stars hidden" onclick="hackCapsule()">
                ⭐️ Взломать досрочно (50 Stars)
            </button>
        </div>
        
        <div id="content-box" class="content-box hidden">
            <h3>Секрет раскрыт 🔓</h3>
            <p id="secret-content" style="white-space: pre-wrap; line-height: 1.6; margin-bottom: 0;"></p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#09090b');

        const BOT_USERNAME = "KapsulaVremeni_bot"; 
        const startParam = tg.initDataUnsafe?.start_param;
        let currentCapsuleId = null;

        if (startParam) {
            currentCapsuleId = startParam;
            document.getElementById('view-view').classList.remove('hidden');
            loadCapsule(currentCapsuleId);
        } else {
            document.getElementById('create-view').classList.remove('hidden');
        }

        async function createCapsule() {
            const text = document.getElementById('text-input').value.trim();
            const hours = document.getElementById('time-input').value;
            const senderId = tg.initDataUnsafe?.user?.id;

            if (!text) return tg.showAlert("Сначала напиши секрет!");
            
            const btn = document.getElementById('create-btn');
            btn.disabled = true;
            btn.innerText = "Прячем...";

            try {
                const reqSenderId = senderId || 123456789; 

                const res = await fetch('/api/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sender_id: reqSenderId, content: text, hours: parseInt(hours) })
                });
                const data = await res.json();
                
                const shareUrl = `https://t.me/${BOT_USERNAME}/app?startapp=${data.id}`;
                const shareText = "Я спрятал для тебя капсулу времени! ⏳ Открой, если сможешь дождаться.";
                
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`);
            } catch(e) {
                tg.showAlert("Ошибка сервера. Попробуй позже.");
                btn.disabled = false;
                btn.innerText = "Спрятать в сейф";
            }
        }

        let timerInterval;
        async function loadCapsule(id) {
            try {
                const res = await fetch(`/api/get?id=${id}`);
                if (!res.ok) return tg.showAlert("Капсула не найдена или удалена.");
                const data = await res.json();

                // 1. ДАННЫЕ ПОЛУЧЕНЫ — запускаем таймер мгновенно
                clearInterval(timerInterval);

                // 2. Только теперь загружаем тяжёлую 3D-модель
                const safeModel = document.getElementById('safe-model');
                const now = new Date();
                const unlockAt = new Date(data.unlock_at);

                if (data.is_hacked || now >= unlockAt) {
                    // Сейф открыт — здесь можно подгрузить модель открытого сейфа
                    // safeModel.setAttribute('src', '/safe_open.glb');
                } else {
                    safeModel.setAttribute('src', '/safe.glb');
                }
                
                const updateTimer = () => {
                    const now = new Date();
                    const unlockAt = new Date(data.unlock_at);
                    const diff = unlockAt - now;

                    if (diff <= 0 || data.is_hacked) {
                        clearInterval(timerInterval);
                        
                        document.getElementById('status-container').classList.add('hidden');
                        document.getElementById('content-box').classList.remove('hidden');
                        document.getElementById('secret-content').innerText = data.content;
                        tg.HapticFeedback.notificationOccurred('success');
                    } else {
                        document.getElementById('hack-btn').classList.remove('hidden');
                        const h = Math.floor(diff / (1000 * 60 * 60));
                        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const s = Math.floor((diff % (1000 * 60)) / 1000);
                        document.getElementById('timer').innerText = 
                            `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    }
                };
                
                updateTimer();
                timerInterval = setInterval(updateTimer, 1000);
            } catch(e) {
                tg.showAlert("Ошибка загрузки капсулы.");
            }
        }

        async function hackCapsule() {
            tg.HapticFeedback.impactOccurred('medium');
            try {
                const res = await fetch(`/api/invoice?id=${currentCapsuleId}`);
                const data = await res.json();
                
                if (data.url) {
                    tg.openInvoice(data.url, (status) => {
                        if (status === 'paid' || status === 'pending') {
                            tg.showAlert("Успех! Сейф взломан 💥");
                            loadCapsule(currentCapsuleId); 
                        }
                    });
                }
            } catch(e) {
                tg.showAlert("Ошибка создания инвойса.");
            }
        }
    </script>
</body>
</html>
