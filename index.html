<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Time Capsule</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#03050a;--surface:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.06);--text:#f4f4f5;--text-dim:#71717a;--accent:#06b6d4;--accent-bright:#22d3ee;--accent-glow:rgba(6,182,212,0.25);--star:#f59e0b;--star-glow:rgba(245,158,11,0.3);--danger:#ef4444;--success:#22c55e }
        *{box-sizing:border-box}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(6,182,212,0.08) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 80%,rgba(139,92,246,0.04) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 20% 20%,rgba(6,182,212,0.03) 0%,transparent 50%);color:var(--text);padding:20px 16px 40px;text-align:center;margin:0;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
        .bg-dots{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.15;background-image:radial-gradient(circle,rgba(255,255,255,0.3) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse 60% 60% at 50% 30%,black 30%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 30%,black 30%,transparent 70%)}
        .content-wrap{position:relative;z-index:1;max-width:420px;margin:0 auto}
        .hidden{display:none!important}
        .brand{font-weight:900;font-size:32px;letter-spacing:-1px;background:linear-gradient(135deg,#fff 0%,#a1a1aa 60%,var(--accent-bright) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
        .subtitle{color:var(--text-dim);font-size:14px;line-height:1.5;margin:0 0 24px;font-weight:400}
        .input-group{margin-bottom:12px;position:relative}
        textarea,select{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,0.025);color:var(--text);font-size:15px;font-family:inherit;resize:none;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);outline:none;-webkit-appearance:none}
        textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow),0 0 20px var(--accent-glow);background:rgba(6,182,212,0.04)}
        textarea::placeholder{color:#52525b}
        select{cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%2371717a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 16px center;padding-right:40px}
        .btn{width:100%;padding:15px;border-radius:14px;border:none;font-weight:600;font-size:15px;cursor:pointer;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden;font-family:inherit;letter-spacing:0.01em}
        .btn-primary{background:linear-gradient(135deg,var(--accent),#0891b2);color:#fff;box-shadow:0 4px 24px var(--accent-glow),0 1px 4px rgba(0,0,0,0.3);margin-top:4px}
        .btn-primary:hover{box-shadow:0 6px 32px rgba(6,182,212,0.35),0 1px 4px rgba(0,0,0,0.3);transform:translateY(-1px)}
        .btn-primary:active{transform:scale(0.97) translateY(0)}
        .btn-primary:disabled{opacity:0.5;pointer-events:none;filter:grayscale(30%)}
        .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,0.1) 50%,transparent 60%);transform:translateX(-100%);transition:transform 0.6s}
        .btn:hover::after{transform:translateX(100%)}
        .btn-stars{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1c1000;box-shadow:0 4px 24px var(--star-glow),0 1px 4px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-weight:700}
        .btn-stars:hover{box-shadow:0 6px 32px rgba(245,158,11,0.4),0 1px 4px rgba(0,0,0,0.3);transform:translateY(-1px)}
        .btn-stars:active{transform:scale(0.97) translateY(0)}
        .star-icon{font-size:18px;filter:drop-shadow(0 0 4px rgba(251,191,36,0.6));animation:starPulse 2s ease-in-out infinite}
        @keyframes starPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
        .model-container{width:100%;height:280px;margin:16px 0 20px;position:relative;border-radius:20px;overflow:hidden;animation:float 4s ease-in-out infinite}
        .model-glow{position:absolute;inset:-4px;border-radius:24px;background:conic-gradient(from 0deg,transparent,var(--accent-glow),transparent,var(--accent-glow),transparent);opacity:0.4;animation:glowRotate 6s linear infinite;pointer-events:none;z-index:0;filter:blur(8px)}
        @keyframes glowRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        model-viewer{width:100%;height:100%;--poster-color:transparent;outline:none;position:relative;z-index:1}
        .loading-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;transition:opacity 0.4s ease;pointer-events:none}
        .loading-overlay.hidden{opacity:0}
        .spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,0.06);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;box-shadow:0 0 20px var(--accent-glow)}
        @keyframes spin{to{transform:rotate(360deg)}}
        .loading-text{color:var(--text-dim);font-size:12px;font-weight:500;margin-top:14px;letter-spacing:0.05em;animation:pulse 2s ease-in-out infinite}
        @keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
        .timer-wrapper{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px 20px 20px;margin-bottom:0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;overflow:hidden}
        .timer-wrapper::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent)}
        .timer-label{color:var(--text-dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
        .timer-status{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px}
        .status-dot{width:6px;height:6px;border-radius:50%;background:var(--danger);animation:dotPulse 1.5s ease-in-out infinite;box-shadow:0 0 8px rgba(239,68,68,0.5)}
        @keyframes dotPulse{0%,100%{opacity:1;box-shadow:0 0 8px rgba(239,68,68,0.5)}50%{opacity:0.4;box-shadow:0 0 2px rgba(239,68,68,0.2)}}
        .timer{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;background:linear-gradient(180deg,#fff 0%,#d4d4d8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 12px rgba(255,255,255,0.15));line-height:1}
        .content-box{background:var(--surface);padding:24px;border-radius:20px;margin-top:16px;border:1px solid var(--border);text-align:left;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:fadeSlideUp 0.5s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden}
        .content-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(34,197,94,0.3),transparent)}
        .content-box h3{margin:0 0 12px;font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
        .unlock-icon{font-size:22px;animation:unlockBounce 0.6s cubic-bezier(0.68,-0.55,0.27,1.55)}
        @keyframes unlockBounce{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
        .secret-content{white-space:pre-wrap;line-height:1.7;margin:0;color:#d4d4d8;font-size:15px}
        @keyframes fadeSlideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @media(max-width:380px){.brand{font-size:26px}.timer{font-size:36px}.model-container{height:240px}}
    </style>
</head>
<body>
    <div class="bg-dots"></div>
    <div class="content-wrap">
        <div id="create-view" class="hidden">
            <div class="brand">Капсула времени</div>
            <p class="subtitle">Спрячь секрет или признание от друга. Доступ откроется только по таймеру — или за звёзды ⭐️</p>
            <div class="input-group"><textarea id="text-input" rows="4" placeholder="Напиши свой секрет здесь..."></textarea></div>
            <div class="input-group"><select id="time-input"><option value="1">🔒 Запереть на 1 час</option><option value="24">🔒 Запереть на 24 часа</option><option value="168">🔒 Запереть на 1 неделю</option></select></div>
            <button class="btn btn-primary" onclick="createCapsule()" id="create-btn">Спрятать в сейф</button>
        </div>
        <div id="view-view" class="hidden">
            <div class="model-container" id="model-container">
                <div class="model-glow"></div>
                <model-viewer id="safe-model" auto-rotate camera-controls disable-zoom shadow-intensity="1" interaction-prompt="none"></model-viewer>
                <div class="loading-overlay" id="loading-overlay"><div class="spinner"></div><div class="loading-text">Загрузка сейфа</div></div>
            </div>
            <div id="status-container">
                <div class="timer-wrapper">
                    <div class="timer-label">Сейф откроется через</div>
                    <div class="timer-status"><div class="status-dot"></div><span style="color:var(--text-dim);font-size:11px;font-weight:500">ЗАКРЫТ</span></div>
                    <div class="timer" id="timer">--:--:--</div>
                </div>
                <button id="hack-btn" class="btn btn-stars hidden" onclick="hackCapsule()"><span class="star-icon">⭐</span> Взломать досрочно (50 Stars)</button>
            </div>
            <div id="content-box" class="content-box hidden">
                <h3><span class="unlock-icon">🔓</span> Секрет раскрыт</h3>
                <div class="secret-content" id="secret-content"></div>
            </div>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();tg.expand();tg.setHeaderColor('#03050a');tg.setBackgroundColor('#03050a');
        const BOT_USERNAME = "KapsulaVremeni_bot";
        const startParam = tg.initDataUnsafe?.start_param;
        let currentCapsuleId = null;
        if (startParam) {currentCapsuleId = startParam;document.getElementById('view-view').classList.remove('hidden');loadCapsule(currentCapsuleId)}
        else {document.getElementById('create-view').classList.remove('hidden')}
        async function createCapsule() {
            const text = document.getElementById('text-input').value.trim();
            const hours = document.getElementById('time-input').value;
            const senderId = tg.initDataUnsafe?.user?.id;
            if (!text) return tg.showAlert("Напиши секрет!");
            const btn = document.getElementById('create-btn');
            btn.disabled = true;btn.innerHTML = '<span style="opacity:0.7">Прячем...</span>';
            try {
                const reqSenderId = senderId || 123456789;
                const res = await fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender_id:reqSenderId,content:text,hours:parseInt(hours)})});
                const data = await res.json();
                const shareUrl = `https://t.me/${BOT_USERNAME}/app?startapp=${data.id}`;
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent("Я спрятал для тебя капсулу времени! Открой, если сможешь дождаться.")}`);
            } catch(e) {tg.showAlert("Ошибка сервера.");btn.disabled = false;btn.innerHTML = 'Спрятать в сейф'}
        }
        let timerInterval;
        async function loadCapsule(id) {
            try {
                const res = await fetch(`/api/get?id=${id}`);
                if (!res.ok) return tg.showAlert("Капсула не найдена.");
                const data = await res.json();
                clearInterval(timerInterval);
                const safeModel = document.getElementById('safe-model');
                const overlay = document.getElementById('loading-overlay');
                safeModel.addEventListener('load',()=>{overlay.classList.add('hidden')},{once:true});
                const isOpen = data.is_hacked || new Date() >= new Date(data.unlock_at);
                overlay.classList.remove('hidden');
                safeModel.setAttribute('src', isOpen ? '/safe-closed.glb' : '/safe.glb');
                const updateTimer = () => {
                    const now = new Date();
                    const unlockAt = new Date(data.unlock_at);
                    const diff = unlockAt - now;
                    if (diff <= 0) {
                        clearInterval(timerInterval);
                        safeModel.addEventListener('load',()=>{overlay.classList.add('hidden')},{once:true});
                        overlay.classList.remove('hidden');
                        safeModel.setAttribute('src','/safe-closed.glb');
                        document.getElementById('status-container').classList.add('hidden');
                        document.getElementById('content-box').classList.remove('hidden');
                        document.getElementById('secret-content').innerText = data.content;
                        tg.HapticFeedback.notificationOccurred('success');
                    } else if (data.is_hacked) {
                        clearInterval(timerInterval);
                        document.getElementById('status-container').classList.add('hidden');
                        document.getElementById('content-box').classList.remove('hidden');
                        document.getElementById('secret-content').innerText = data.content;
                        tg.HapticFeedback.notificationOccurred('success');
                    } else {
                        document.getElementById('hack-btn').classList.remove('hidden');
                        const h = Math.floor(diff/(1000*60*60));
                        const m = Math.floor((diff%(1000*60*60))/(1000*60));
                        const s = Math.floor((diff%(1000*60))/1000);
                        document.getElementById('timer').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                    }
                };
                updateTimer();
                timerInterval = setInterval(updateTimer,1000);
            } catch(e) {tg.showAlert("Ошибка загрузки.")}
        }
        async function hackCapsule() {
            tg.HapticFeedback.impactOccurred('medium');
            try {
                const res = await fetch(`/api/invoice?id=${currentCapsuleId}`);
                const data = await res.json();
                if (data.url) {
                    tg.openInvoice(data.url,(status)=>{
                        if (status==='paid'||status==='pending'){tg.showAlert("Успех! Взломан");loadCapsule(currentCapsuleId)}
                    });
                }
            } catch(e) {tg.showAlert("Ошибка инвойса.")}
        }
    </script>
</body>
</html>
